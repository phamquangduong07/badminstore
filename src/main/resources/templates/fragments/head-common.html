<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Khối <head> DÙNG CHUNG cho mọi trang (layout/base, layout/admin và các trang lỗi đứng riêng).
  Gồm: charset + viewport + favicon + font Be Vietnam Pro + Bootstrap 5 + Bootstrap Icons + theme.css.

  Vì sao tách ra: trước đây mỗi trang chép lại 5 dòng <link>, riêng layout/admin bị THIẾU font
  Be Vietnam Pro nên chữ trong khu quản trị hiển thị sai font so với trang khách.
  Từ giờ sửa 1 chỗ là mọi trang đổi theo.

  Cách dùng (đặt ngay sau <title> trong <head>):
      <th:block th:replace="~{fragments/head-common :: commonHead}"></th:block>
  CSS riêng của từng khu vực (swiper.css, aos.css, admin.css) nạp TIẾP SAU fragment này.
-->
<th:block th:fragment="commonHead">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">

    <!-- Font Be Vietnam Pro (UI_GUIDE: hiển thị tiếng Việt rõ, đẹp) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">

    <!-- Bootstrap 5 (lưới + tiện ích responsive) + Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS dự án: LUÔN nạp sau Bootstrap (theme.css ghi đè biến --bs-* và thêm thành phần riêng) -->
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</th:block>

</body>
</html>
