<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <title>Quản lý đơn hàng</title>
</head>
<body>

<th:block layout:fragment="content">

    <div class="page-head">
        <h1 class="page-title"><i class="bi bi-receipt" aria-hidden="true"></i> Quản lý đơn hàng</h1>
        <div class="d-flex align-items-center gap-2">
            <span class="text-muted small" th:text="|Tổng ${orders.totalElements} đơn phù hợp|">Tổng 0 đơn</span>
            <a class="btn btn-sm btn-primary" th:href="@{/admin/don-hang/tao-don}">
                <i class="bi bi-plus-square" aria-hidden="true"></i> Tạo đơn thủ công
            </a>
        </div>
    </div>

    <!-- Lọc trạng thái + tìm kiếm mã đơn / SĐT / email -->
    <form class="card-soft mb-3" method="get" th:action="@{/admin/don-hang}">
        <div class="card-body row g-2 align-items-end">
            <div class="col-sm-6 col-lg-3">
                <label class="form-label small" for="status">Trạng thái</label>
                <select class="form-select" id="status" name="status">
                    <option value="" th:selected="${statusFilter == null}">-- Tất cả --</option>
                    <option th:each="status : ${statuses}" th:value="${status.name()}"
                            th:text="${status.label}" th:selected="${status == statusFilter}">Trạng thái</option>
                </select>
            </div>
            <div class="col-sm-6 col-lg-4">
                <label class="form-label small" for="keyword">Mã đơn / SĐT / email khách</label>
                <input class="form-control" id="keyword" name="keyword" th:value="${keyword}"
                       placeholder="Ví dụ: BS261016… hoặc 0987…">
            </div>
            <div class="col-lg-5 d-flex gap-2">
                <button class="btn btn-primary" type="submit"><i class="bi bi-search" aria-hidden="true"></i> Lọc</button>
                <a class="btn btn-outline-secondary" th:href="@{/admin/don-hang}">Xoá lọc</a>
            </div>
        </div>
    </form>

    <div class="card-soft">
        <div class="table-responsive table-scroll">
            <table class="table table-hover align-middle mb-0 table-sticky">
                <thead>
                <tr>
                    <th scope="col">Mã đơn</th>
                    <th scope="col">Khách</th>
                    <th scope="col">Ngày đặt</th>
                    <th scope="col" class="text-center">SL</th>
                    <th scope="col" class="text-end">Tổng tiền</th>
                    <th scope="col">Trạng thái</th>
                    <th scope="col">Thanh toán</th>
                    <th scope="col" class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${orders.content}">
                    <td>
                        <a class="fw-semibold text-decoration-none" th:href="@{/admin/don-hang/{id}(id=${row.id})}"
                           th:text="${row.orderCode}">BS000</a>
                        <div class="mt-1" th:if="${row.orderSource.name() == 'MANUAL'}">
                            <span class="badge badge-brand">Tạo thủ công</span>
                        </div>
                    </td>
                    <td>
                        <div th:text="${row.customerLabel}">khach@example.com</div>
                        <div class="small text-muted" th:text="${row.receiverName}">Người nhận</div>
                    </td>
                    <td class="small text-muted"
                        th:insert="~{fragments/common :: dateTime(${row.createdAt})}">00/00/0000</td>
                    <td class="text-center" th:text="${row.itemQuantity}">0</td>
                    <td class="text-end fw-semibold" th:insert="~{fragments/common :: money(${row.totalAmount})}">0 ₫</td>
                    <td>
                        <span class="status-pill" th:classappend="|status-${row.orderStatus.name()}|"
                              th:text="${row.orderStatus.label}">Trạng thái</span>
                    </td>
                    <td>
                        <div class="small" th:text="${row.paymentMethodLabel}">COD</div>
                        <span class="status-pill"
                              th:classappend="${row.paymentStatus != null} ? |status-${row.paymentStatus.name()}| : 'status-INACTIVE'"
                              th:text="${row.paymentStatusLabel}">Chờ</span>
                    </td>
                    <td class="text-end">
                        <div class="d-flex justify-content-end gap-1">
                            <form th:if="${row.orderStatus.name() == 'PENDING'}"
                                  th:action="@{/admin/don-hang/{id}/xac-nhan(id=${row.id})}" method="post"
                                  data-confirm="Xác nhận đơn này và TRỪ KHO ngay?" class="d-inline">
                                <button class="btn btn-sm btn-success" type="submit"
                                        th:attr="aria-label=|Xác nhận đơn ${row.orderCode}|" title="Xác nhận đơn (trừ kho)">
                                    <i class="bi bi-check2-circle" aria-hidden="true"></i>
                                    <span class="d-none d-xl-inline">Xác nhận</span>
                                </button>
                            </form>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/don-hang/{id}(id=${row.id})}"
                               th:attr="aria-label=|Xem chi tiết đơn ${row.orderCode}|" title="Chi tiết đơn">
                                <i class="bi bi-eye" aria-hidden="true"></i>
                                <span class="d-none d-xl-inline">Chi tiết</span>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${orders.empty}">
                    <td colspan="8" class="p-0"
                        th:insert="~{fragments/common :: emptyState('bi-inbox', 'Không có đơn hàng nào phù hợp bộ lọc.')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Phân trang dùng chung – giữ nguyên bộ lọc (trạng thái, từ khoá) khi sang trang -->
    <div th:replace="~{fragments/pagination :: pager(
            page=${orders}, pageNumbers=${pageNumbers},
            url='/admin/don-hang', ariaLabel='Phân trang đơn hàng', itemLabel='đơn hàng',
            query=|status=${statusFilter ?: ''}&keyword=${#uris.escapeQueryParam(keyword ?: '')}|)}"></div>

</th:block>

</body>
</html>
