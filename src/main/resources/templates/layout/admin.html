<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">Khu quản trị BadStore</title>

    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">

    <!-- Bootstrap 5 + Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-body-tertiary">

<div class="container-fluid">
    <div class="row min-vh-100">

        <!-- Menu dọc: offcanvas trên mobile, cố định từ màn hình lg -->
        <div class="col-lg-2 p-0 bg-dark">
            <div class="offcanvas-lg offcanvas-start bg-dark text-white" tabindex="-1" id="adminSidebar"
                 aria-labelledby="adminSidebarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="adminSidebarLabel">Menu quản trị</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                            data-bs-target="#adminSidebar" aria-label="Đóng menu"></button>
                </div>
                <div class="offcanvas-body p-0">
                    <div th:replace="~{fragments/admin/sidebar :: sidebar(${adminMenu})}"></div>
                </div>
            </div>
        </div>

        <!-- Nội dung chính -->
        <main class="col-lg-10 d-flex flex-column p-0">
            <header class="admin-topbar border-bottom px-3 py-2 d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#adminSidebar" aria-controls="adminSidebar" aria-label="Mở menu quản trị">
                    <i class="bi bi-list"></i>
                </button>
                <span class="fw-semibold"><i class="bi bi-shield-lock text-primary"></i> Khu quản trị BadStore</span>

                <div class="ms-auto d-flex align-items-center gap-2">
                    <a class="btn btn-sm btn-outline-primary d-none d-md-inline-flex" th:href="@{/}">
                        <i class="bi bi-shop"></i> Xem cửa hàng
                    </a>
                    <span class="text-muted small d-none d-sm-inline" sec:authentication="name">admin@badstore.local</span>
                    <form th:action="@{/dang-xuat}" method="post" class="mb-0">
                        <button class="btn btn-sm btn-outline-danger" type="submit">
                            <i class="bi bi-box-arrow-right"></i> Đăng xuất
                        </button>
                    </form>
                </div>
            </header>

            <div class="p-3 p-lg-4 flex-grow-1">
                <div th:replace="~{fragments/flash :: flash}"></div>
                <th:block layout:fragment="content"></th:block>
            </div>
        </main>
    </div>
</div>

<!-- SweetAlert2 – xác nhận trước mọi thao tác ghi CSDL -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
