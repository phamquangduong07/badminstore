<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">Khu quản trị BadStore</title>

    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">

    <!-- Bootstrap 5 + Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS của dự án (đặt SAU bootstrap) -->
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <!-- CSS riêng khu quản trị (đặt SAU theme.css để ghi đè khi cần) -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="bg-body-tertiary">

<!-- Liên kết "bỏ qua menu": ẩn với chuột, chỉ hiện khi Tab bằng bàn phím (a11y) -->
<a class="skip-link btn btn-primary btn-sm" href="#noi-dung-chinh">Bỏ qua tới nội dung chính</a>

<div class="container-fluid">
    <div class="row min-vh-100 admin-layout">

        <!-- Menu dọc: offcanvas trên mobile, dính bên trái và cao hết màn hình từ lg -->
        <div class="col-lg-2 p-0 admin-shell">
            <div class="offcanvas-lg offcanvas-start admin-offcanvas" tabindex="-1" id="adminSidebar"
                 aria-labelledby="adminSidebarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="adminSidebarLabel">Menu quản trị</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                            data-bs-target="#adminSidebar" aria-label="Đóng menu"></button>
                </div>
                <div class="offcanvas-body p-0">
                    <div th:replace="~{fragments/admin/sidebar :: sidebar(${adminMenu})}"></div>
                </div>
            </div>
        </div>

        <!-- Nội dung chính -->
        <main id="noi-dung-chinh" tabindex="-1" class="col-lg-10 d-flex flex-column p-0">
            <header class="admin-topbar d-print-none">
                <button class="btn btn-sm btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#adminSidebar" aria-controls="adminSidebar" aria-label="Mở menu quản trị">
                    <i class="bi bi-list"></i>
                </button>

                <span class="fw-semibold d-none d-sm-inline-flex align-items-center gap-2">
                    <i class="bi bi-shield-lock text-primary"></i> Khu quản trị BadStore
                </span>

                <div class="ms-auto d-flex align-items-center gap-2">
                    <a class="btn btn-sm btn-outline-primary d-none d-md-inline-flex" th:href="@{/}">
                        <i class="bi bi-shop"></i> Xem cửa hàng
                    </a>

                    <span class="d-none d-lg-inline-flex align-items-center gap-2 small text-muted">
                        <i class="bi bi-person-circle fs-5"></i>
                        <span sec:authentication="name">admin@badstore.local</span>
                    </span>

                    <form th:action="@{/dang-xuat}" method="post" class="mb-0"
                          data-confirm="Bạn chắc chắn muốn đăng xuất khỏi khu quản trị?">
                        <button class="btn btn-sm btn-outline-danger" type="submit" title="Đăng xuất">
                            <i class="bi bi-box-arrow-right"></i>
                            <span class="d-none d-sm-inline">Đăng xuất</span>
                        </button>
                    </form>
                </div>
            </header>

            <div class="admin-content p-3 p-lg-4 flex-grow-1">
                <div th:replace="~{fragments/flash :: flash}"></div>
                <th:block layout:fragment="content"></th:block>
            </div>
        </main>
    </div>
</div>

<!-- Nút về đầu trang (app.js bật/tắt khi cuộn) – hữu ích với bảng dài trong khu quản trị -->
<button id="backToTop" class="btn btn-primary rounded-circle d-none" type="button" aria-label="Lên đầu trang">
    <i class="bi bi-arrow-up" aria-hidden="true"></i>
</button>

<!-- Thứ tự JS: Bootstrap (bundle) → SweetAlert2 → JS dùng chung của dự án
     (trang quản trị không dùng Swiper/AOS nên không nạp để nhẹ trang) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/main.js}" defer></script>
<script th:src="@{/js/app.js}" defer></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
