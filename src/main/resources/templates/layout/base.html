<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">BadStore – Vợt cầu lông chính hãng</title>

    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">

    <!-- Bootstrap 5 (layout responsive) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Swiper – slider banner -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <!-- AOS – hiệu ứng xuất hiện khi cuộn -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
    <!-- CSS của dự án -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">

<div th:replace="~{fragments/header :: header}"></div>

<main class="flex-grow-1">
    <div class="container py-4">
        <div th:replace="~{fragments/flash :: flash}"></div>
        <th:block layout:fragment="content"></th:block>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<!-- SweetAlert2 – hộp thoại xác nhận trước khi ghi CSDL và thông báo sau khi thành công -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<!-- Chart.js chỉ nạp ở trang dashboard admin (layout:fragment="scripts") -->
<script th:src="@{/js/main.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
