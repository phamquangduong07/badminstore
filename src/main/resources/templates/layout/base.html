<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">BadStore – Vợt cầu lông chính hãng</title>

    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">

    <!-- Font Be Vietnam Pro (UI_GUIDE: hiển thị tiếng Việt rõ, đẹp) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">

    <!-- Bootstrap 5 (lưới + tiện ích responsive) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Swiper – slider banner -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <!-- AOS – hiệu ứng xuất hiện khi cuộn trang -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
    <!-- CSS dự án: LUÔN nạp sau Bootstrap (theme.css ghi đè biến --bs-* và thêm thành phần riêng) -->
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Liên kết "bỏ qua menu": ẩn với chuột, chỉ hiện khi Tab bằng bàn phím (a11y) -->
<a class="skip-link btn btn-primary btn-sm" href="#noi-dung-chinh">Bỏ qua tới nội dung chính</a>

<!-- ===== Header: logo, tìm kiếm nhanh, giỏ hàng, tài khoản (fragments/header.html) ===== -->
<div th:replace="~{fragments/header :: header}"></div>

<main id="noi-dung-chinh" tabindex="-1" class="flex-grow-1">
    <div class="container py-4">
        <!-- Flash message sau redirect (PRG): alert hiển thị + toast SweetAlert2 trong main.js -->
        <div th:replace="~{fragments/flash :: flash}"></div>
        <th:block layout:fragment="content"></th:block>
    </div>
</main>

<!-- ===== Footer: 3 cột thông tin – liên hệ – mua hàng (fragments/footer.html) ===== -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Nút về đầu trang: app.js bật/tắt khi cuộn (mẫu trong docs/UX_UPGRADE.md) -->
<button id="backToTop" class="btn btn-primary rounded-circle d-none" type="button" aria-label="Lên đầu trang">
    <i class="bi bi-arrow-up" aria-hidden="true"></i>
</button>

<!-- Thứ tự JS: Bootstrap (bundle) → Swiper → AOS → SweetAlert2 → JS dùng chung của dự án -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- main.js: toast flash, xác nhận ghi CSDL, Swiper, GHN… (hành vi riêng của dự án) -->
<script th:src="@{/js/main.js}" defer></script>
<!-- app.js: hành vi UX dùng chung (data-confirm, chống bấm đúp, data-qty, nút lên đầu trang, AOS) -->
<script th:src="@{/js/app.js}" defer></script>
<!-- Chart.js / script riêng của từng trang nạp qua layout:fragment="scripts" -->
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
