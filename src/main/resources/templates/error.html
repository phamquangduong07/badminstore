<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${status != null ? status + ' – Lỗi | BadStore' : 'Lỗi | BadStore'}">Lỗi | BadStore</title>

    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">

    <!-- Trang lỗi dự phòng cho mọi mã trạng thái chưa có template riêng (400, 405, 4xx/5xx khác):
         đứng riêng nhưng theo đúng brand – font Be Vietnam Pro + Bootstrap + Bootstrap Icons + theme.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="d-flex flex-column min-vh-100">
<main class="flex-grow-1 d-flex align-items-center">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 text-center">
                <a class="navbar-brand fw-bold d-inline-flex align-items-center mb-3" th:href="@{/}"
                   aria-label="BadStore – về trang chủ">
                    <span class="brand-mark"><i class="bi bi-activity" aria-hidden="true"></i></span>
                    <span>BadStore</span>
                </a>
                <div class="display-1 fw-bold text-primary" th:text="${status ?: '!'}">!</div>
                <h1 class="h3 mt-3">Rất tiếc, yêu cầu này không thực hiện được</h1>
                <p class="text-muted" th:if="${message != null and !#strings.isEmpty(message)}" th:text="${message}">Đường dẫn có thể đã thay đổi.</p>
                <p class="text-muted">Có thể đường dẫn không đúng hoặc thao tác chưa hợp lệ. Vui lòng thử lại; nếu tình trạng lặp lại, hãy báo cho quản trị viên kèm thời điểm bạn thao tác.</p>
                <a class="btn btn-primary mt-3" th:href="@{/}"><i class="bi bi-house-door" aria-hidden="true"></i> Về trang chủ</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
