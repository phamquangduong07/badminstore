<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 – Không tìm thấy trang | BadStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-body-tertiary">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 text-center">
            <div class="display-1 fw-bold text-primary">404</div>
            <h1 class="h3 mt-3">Không tìm thấy trang bạn cần</h1>
            <p class="text-muted" th:if="${message != null}" th:text="${message}">Đường dẫn có thể đã thay đổi.</p>
            <p class="text-muted" th:unless="${message != null}">Đường dẫn có thể đã thay đổi hoặc sản phẩm không còn được bán.</p>
            <a class="btn btn-primary mt-3" th:href="@{/}"><i class="bi bi-house-door"></i> Về trang chủ</a>
        </div>
    </div>
</div>
</body>
</html>
