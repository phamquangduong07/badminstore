<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>404 – Không tìm thấy trang | BadStore</title>

    <!-- Trang lỗi đứng riêng (không dùng layout chung) nhưng dùng chung khối <head> của dự án -->
    <th:block th:replace="~{fragments/head-common :: commonHead}"></th:block>
</head>
<body class="d-flex flex-column min-vh-100">
<main class="flex-grow-1 d-flex align-items-center">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 text-center">
                <a class="navbar-brand fw-bold d-inline-flex align-items-center mb-3" th:href="@{/}"
                   aria-label="BadStore – về trang chủ">
                    <span class="brand-mark"><i class="bi bi-activity" aria-hidden="true"></i></span>
                    <span>BadStore</span>
                </a>
                <div class="display-1 fw-bold text-primary">404</div>
                <h1 class="h3 mt-3">Không tìm thấy trang bạn cần</h1>
                <p class="text-muted" th:if="${message != null}" th:text="${message}">Đường dẫn có thể đã thay đổi.</p>
                <p class="text-muted" th:unless="${message != null}">Đường dẫn có thể đã thay đổi hoặc sản phẩm không còn được bán.</p>
                <a class="btn btn-primary mt-3" th:href="@{/}"><i class="bi bi-house-door" aria-hidden="true"></i> Về trang chủ</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
