<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>403 – Không có quyền truy cập | BadStore</title>

    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">

    <!-- Trang lỗi đứng riêng (không dùng layout chung) nhưng vẫn theo đúng brand:
         font Be Vietnam Pro + Bootstrap + Bootstrap Icons + theme.css của dự án -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="d-flex flex-column min-vh-100">
<main class="flex-grow-1 d-flex align-items-center">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 text-center">
                <a class="navbar-brand fw-bold d-inline-flex align-items-center mb-3" th:href="@{/}"
                   aria-label="BadStore – về trang chủ">
                    <span class="brand-mark"><i class="bi bi-activity" aria-hidden="true"></i></span>
                    <span>BadStore</span>
                </a>
                <div class="display-1 fw-bold text-primary">403</div>
                <h1 class="h3 mt-3">Bạn không có quyền truy cập trang này</h1>
                <p class="text-muted">Khu vực quản trị chỉ dành cho tài khoản ADMIN. Nếu bạn cho rằng đây là nhầm lẫn, hãy liên hệ quản trị viên.</p>
                <div class="d-flex justify-content-center gap-2 mt-4">
                    <a class="btn btn-primary" th:href="@{/}"><i class="bi bi-house-door" aria-hidden="true"></i> Về trang chủ</a>
                    <a class="btn btn-outline-secondary" th:href="@{/dang-nhap}">Đăng nhập tài khoản khác</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
