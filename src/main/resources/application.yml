# ==============================================================================
# BadStore – cấu hình CHUNG cho mọi môi trường (file này được commit)
#
# 3 tầng cấu hình (ưu tiên tăng dần): application.yml → application-local.yml → biến môi trường
#   • Mặc định an toàn: khai báo ở đây.
#   • Bí mật (mật khẩu, token): KHÔNG ghi vào file này – xem application-local.example.yml
#     và .env.example. Chi tiết: docs/HUONG_DAN_CHAY.md
# ==============================================================================

spring:
  application:
    name: badstore
  profiles:
    default: local                       # chạy không tham số vẫn tự nạp application-local.yml

  # ---------------------------------------------------------------------------
  # CSDL SQL Server
  # ---------------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=BadminStore;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # ---------------------------------------------------------------------------
  # JPA / Hibernate
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate                 # KHÔNG cho Hibernate sửa schema: đổi bảng ⇒ sửa docs/*.sql
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # ---------------------------------------------------------------------------
  # View (Thymeleaf) + upload
  # ---------------------------------------------------------------------------
  thymeleaf:
    cache: false                         # đặt true khi deploy
  servlet:
    multipart:
      max-file-size: 5MB                 # ảnh sản phẩm admin tải lên
      max-request-size: 10MB
  messages:
    basename: messages
    encoding: UTF-8

server:
  port: 8088
  servlet:
    encoding:
      charset: UTF-8
      force: true

# ==============================================================================
# Cấu hình riêng của ứng dụng – đọc bởi các lớp @ConfigurationProperties trong config/
# ==============================================================================
app:
  upload-dir: ${UPLOAD_DIR:uploads}      # thư mục lưu ảnh admin tải lên (đã .gitignore)

  shipping:                              # WebConfig / CheckoutService
    default-fee: 30000                   # phí ship cố định (VND) khi GHN tắt hoặc nhập địa chỉ tay

  admin:                                 # DataInitializer: tạo ADMIN lần đầu (BCrypt)
    email: ${ADMIN_EMAIL:admin@badstore.local}
    password: ${ADMIN_PASSWORD:}         # trống ⇒ không tạo tài khoản nào

  shop:                                  # ShopProperties: phiếu bán tại quầy + chân trang
    name: ${SHOP_NAME:BadStore}
    address: "${SHOP_ADDRESS:Số 1 Đại Cồ Việt, Bách Khoa, Hà Nội}"
    hotline: ${SHOP_HOTLINE:1900 0000}
    email: ${SHOP_EMAIL:cskh@badstore.local}

  ghn:                                   # GhnProperties: tích hợp Giao Hàng Nhanh (tuỳ chọn)
    enabled: ${GHN_ENABLED:true}         # true = bật sẵn để demo; đặt GHN_ENABLED=false để tắt hẳn
    mock: ${GHN_MOCK:true}               # true = KHÔNG cần token/mạng: Tỉnh–Huyện–Xã dùng dữ liệu GHN
                                         #        lưu sẵn đầy đủ (resources/ghn/*.json), phí/vận đơn là số giả.
                                         #        Gọi API GHN thật: đặt GHN_MOCK=false (+ GHN_TOKEN)
    mock-status: ${GHN_MOCK_STATUS:delivering}
    base-url: ${GHN_BASE_URL:https://online-gateway.ghn.vn/shiip/public-api}
    token: ${GHN_TOKEN:}                 # KHÔNG commit token: đặt qua biến môi trường / application-local.yml
                                         # Có token (GHN_MOCK=false) là đã chọn được Tỉnh–Huyện–Xã theo GHN.
    shop-id: ${GHN_SHOP_ID:}             # mã shop GHN – chỉ cần khi tính phí/tạo vận đơn GHN
    from-district-id: ${GHN_FROM_DISTRICT_ID:}   # quận của kho lấy hàng – chỉ cần khi tính phí/tạo vận đơn
    from-ward-code: ${GHN_FROM_WARD_CODE:}
    from-name: ${app.shop.name}
    from-phone: ${GHN_FROM_PHONE:0900000000}     # GHN kiểm tra số điện thoại hợp lệ
    from-address: ${app.shop.address}
    weight-gram: 1500                    # 1 cây vợt + hộp; thêm 300 g mỗi cây (GhnAddressService)
    length-cm: 60
    width-cm: 20
    height-cm: 12
    service-type-id: 2                   # 2 = chuyển phát thương mại điện tử
    payment-type-id: 1                   # 1 = shop trả phí vận chuyển
    insurance-value: 500000              # giá trị khai giá (VND)
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    cache-ttl-seconds: 600               # cache Tỉnh–Huyện–Xã & phí ship 10 phút
    sync-enabled: ${GHN_SYNC_ENABLED:false}      # scheduler tự đồng bộ trạng thái vận đơn
    sync-delay-ms: 600000
